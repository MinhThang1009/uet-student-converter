name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Check with Ruff
        run: ruff check src scripts/convert_pdf_to_excel.py tests

      - name: Check Ruff formatting
        run: ruff format --check src scripts/convert_pdf_to_excel.py tests

      - name: Check installed dependencies
        run: python -m pip check
