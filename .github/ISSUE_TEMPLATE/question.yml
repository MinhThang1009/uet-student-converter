name: Question
description: Ask for help using UET Student Converter
title: '[Question]: '
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Describe what you are trying to do. Do not include student data, passwords, or secrets.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include the relevant command and a redacted error message, if applicable.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, Python version, and project version.
    validations:
      required: false
  - type: checkboxes
    id: sensitive_information
    attributes:
      label: Sensitive information
      options:
        - label: I removed student data, credentials, and secrets.
          required: true
